schema:
  schema_id: stroke_bg5cgq_learning
  name: BG5CGQ 动态学习（万象增强）
  version: '8.1'
  description: 独立学习版；动态组词、全场景上屏高频联想、用户词独立持久化。已移植万象拼音的优势功能：字符集过滤（大字集/小字集）、简繁切换（通繁/港繁/臺繁）、上下文调频、手动排序、局部提交、自定义置顶词。空格连续联想上屏：上屏后连打联想候选（讯飞式）。
  dependencies:
    - custom_phrase

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: ascii_punct
    states: [中标, 英标]
  - name: prediction
    reset: 1
    states: [关闭联想, 开启联想]
  - name: context_reorder
    reset: 1
    states: [上下文关, 上下文开]
  - name: charset_filter
    states: [大字集, 小字集]
  - name: fuzzy_stroke
    reset: 0
    states: [标准笔画, 模糊笔画]
  - options: [s2s, s2t, s2hk, s2tw]
    states: [简体, 通繁, 港繁, 臺繁]

engine:
  processors:
    - lua_processor@*wanxiang.context_reorder*P  # 上下文调频
    - lua_processor@*wanxiang.super_sequence*P   # 手动排序：Ctrl+j 上移 / [ 下移 / Ctrl+l 重置 / Ctrl+p 置顶
    - lua_processor@*demote                     # 手动降权：对当前高亮候选降频（默认键 ]，皮肤常用键触发）
    - lua_processor@*predict_space               # 空格连续上屏：上屏联想候选后连打（我→的→人）
    - lua_processor@*wanxiang.partial_commit    # 局部提交：Ctrl+1~0 提交句子前几个字
    - predictor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - predict_translator
    - lua_translator@*wanxiang_super_calculator
    - lua_translator@*segment_phrase
    - lua_translator@*pinyin_reverse          # 拼音反查：切到字母键盘输入拼音出汉字
  filters:
    - lua_filter@*filter_seg_count                 # 笔画分词过滤（保留原学习核心）
    - lua_filter@*wanxiang.charset_filter          # 字符集过滤
    - lua_filter@*wanxiang.custom_phrase           # 自定义置顶词
    - lua_filter@*wanxiang.context_reorder*F        # 上下文调频
    - simplifier@s2t                              # 简转繁
    - simplifier@s2hk                            # 简转港
    - simplifier@s2tw                            # 简转台
    - lua_filter@*wanxiang.super_sequence*F       # 手动排序
    - lua_filter@*demote_filter                     # 手动降权：降权词沉底/隐藏（任意候选生效）
    - uniquifier                                   # 去重

speller:
  alphabet: "12345?'V"
  delimiter: ' '

menu:
  page_size: 9

translator:
  dictionary: stroke_bg5cgq
  preedit_format:
    - xlit/12345/一丨丿丶乛/
  comment_format:
    - erase/.*$/
  enable_completion: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: 1.0

predictor:
  db: predict.db
  max_candidates: 9
  max_iterations: 10

# 轻量级 n-gram 上下文联想（基于上屏词对学习，提升连续输入时候选精准度）
ngram:
  enable: true          # 总开关
  word_weight: 100000    # 词级上下文分步长（与 learning 频次同量级）
  word_cap: 3            # 词级上下文分上限（相当于最多 3 次用户频次）
  char_weight: 100000    # 字级上下文分步长
  char_cap: 2            # 字级上下文分上限

# 自定义置顶词（custom_phrase.dict.yaml，编码需用笔画数字码 1-5）
# enable_completion: true 开启前缀联想（输入前几笔也能出候选）；max_candidates 限制输出量防止候选爆炸
custom_phrase:
  dictionary: custom_phrase
  prism: stroke_custom_phrase
  enable_user_dict: false
  enable_completion: true
  max_candidates: 10
  always_show_comments: true
  spelling_hints: 50

# 简码配置（custom_phrase.lua 只读取插入位置与候选数；笔画方案未启用 abbrev 开关，不加载拼音简码）
abbrev_phrase:
  insert_position: 2
  max_candidates: 1

# 上下文调频
context_reorder:
  db_name: context_reorder
  enable_fallback_reorder: false
  context_timeout: 5000
  custom_classifiers:
    - 个只名位口人头匹条群批伙多
    - 张把件台部块根颗粒滴片朵面扇顶栋座所辆艘架盏支枝杆
    - 双对副套打串束排阵堆叠摞扎
    - 杯瓶盒包份碗锅盆桶袋罐盘
    - 次场局回趟顿番遍声项宗桩款步招
    - 年月天周岁秒分刻代期届任夜季
    - 本册篇首句段卷幅节堂门帖字行
    - 米寸尺里斤两吨克升元角毛笔百千万亿

# 手动排序快捷键
# 手机皮肤：剪粘键发送 [ = 下移；常用键发送 ] = 降权（见 demote 配置）
super_sequence:
  db_name: "sequence"
  up: "Control+j"        # 上移
  down: "bracketleft"   # 下移（皮肤「下移」键发送 [ 键触发，Rime 键名 bracketleft）
  reset: "Control+l"     # 重置
  pin: "Control+p"       # 置顶

# 降权功能键：桌面按 Control+Delete；皮肤「降权」键发送 ] 键（Rime 键名 bracketright）同样触发
demote:
  key: "Control+Delete"   # 触发键（皮肤「降权」键发送 Control+Delete）
  mode: demote          # demote=沉底（默认）；hide=直接隐藏

# 字符集过滤（a=通用规范汉字表；fa/ha/ta=简繁系）
charset_filter:
  - option: charset_filter
    base: a
    addlist:
      - "诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲"
    blacklist: []
  - option: s2t
    base: fa
    addlist: []
    blacklist: []
  - option: s2hk
    base: ha
    addlist: []
    blacklist: []
  - option: s2tw
    base: ta
    addlist: []
    blacklist: []

s2t:
  option_name: s2t
  opencc_config: wanxiang_s2t.json
  tips: none
  tags: [abc]

s2hk:
  option_name: s2hk
  opencc_config: wanxiang_s2hk.json
  tips: none
  tags: [abc]

s2tw:
  option_name: s2tw
  opencc_config: wanxiang_s2tw.json
  tips: none
  tags: [abc]

key_binder:
  import_preset: default
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: has_menu, accept: "Control+k", send: "bracketleft"}  # 桌面 Ctrl+K 兼容下移（转发为 [ 键）
    - {when: always, toggle: ascii_punct, accept: Control+Shift+3}
    - {when: always, toggle: ascii_punct, accept: Control+Shift+numbersign}
    - {when: always, toggle: s2t, accept: Control+Shift+4}
    - {when: always, toggle: s2t, accept: Control+Shift+dollar}

punctuator:
  import_preset: default

calculator:
  prefix: V
  show_prefix: false

recognizer:
  patterns:
    calculator: ^V.+

editor:
  bindings:
    space: confirm
    Return: commit_raw_input
    Control+Return: commit_script_text
    Control+Shift+Return: commit_comment
    BackSpace: revert
    Delete: delete
    Control+Delete: delete_candidate
    Escape: cancel